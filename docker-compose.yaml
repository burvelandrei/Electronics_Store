services:
  app:
    build: .
    working_dir: /project/app
    entrypoint: ./entrypoint.sh
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    ports:
      - 8000:8000
    env_file: .env
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - electronics-store

  postgres_db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - electronics-store

  redis:
    image: redis:7
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - electronics-store

  celery_worker:
    build: .
    working_dir: /project/app
    command: celery -A core worker -l info
    restart: unless-stopped
    volumes:
      - ./logs:/project/logs
    env_file: .env
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - electronics-store

  celery_beat:
    build: .
    working_dir: /project/app
    command: celery -A core beat -l info
    restart: unless-stopped
    volumes:
      - ./logs:/project/logs
    env_file: .env
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - electronics-store

volumes:
  pg_data:
  redis_data:

networks:
  electronics-store:
    driver: bridge